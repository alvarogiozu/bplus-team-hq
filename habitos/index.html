    <meta name="theme-color" content="#232136" media="(prefers-color-scheme: dark)" />
    <script>
      // Tema ANTES del primer paint (mismo criterio que el store): si el celular
      // esta en oscuro, los tokens dark se activan desde el frame 1. Sin esto,
      // habia una ventana donde el fondo era claro y la tinta ya era dark (o al
      // reves) y el texto quedaba invisible.
      try {
        var p = JSON.parse(localStorage.getItem('bplus.prefs') || '{}') || {}
        var t = p.theme || 'system'
        var d = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = d ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
