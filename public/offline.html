<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Rockie</title>
    <meta name="theme-color" content="#f0ebe5" />
    <script>
      // mismo tema que la app (src: index.html)
      try {
        var t = localStorage.getItem('hq.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      :root { --bg: #f0ebe5; --ink: #575279; --ink-soft: #797593; --brand: #2a82ad; --brand-edge: #216b87; --on: #fdfbf7; color-scheme: light; }
      :root[data-theme='dark'] { --bg: #232136; --ink: #e0def4; --ink-soft: #b5b1cf; --brand: #3a95b8; --brand-edge: #216b87; color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); }
      body {
        display: grid; place-items: center; padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
        font-family: 'Quicksand', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
      }
      main { max-width: 320px; display: grid; justify-items: center; gap: 16px; }
      img { width: 120px; height: 120px; border-radius: 28px; animation: respira 3.2s ease-in-out infinite; }
      h1 { margin: 8px 0 0; font: 700 24px/1.2 'Fraunces', Georgia, serif; }
      p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--ink-soft); }
      button {
        margin-top: 8px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 16px; cursor: pointer;
        font: 700 16px/1 inherit; font-family: inherit; color: var(--on); background: var(--brand);
        box-shadow: 0 4px 0 var(--brand-edge); transition: transform 0.12s, box-shadow 0.12s;
      }
      button:active { transform: translateY(4px); box-shadow: 0 0 0 var(--brand-edge); }
      @keyframes respira { 50% { transform: scale(1.04); } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>Rockie necesita internet para abrir. Cuando vuelva la señal, se abre solo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
      addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
