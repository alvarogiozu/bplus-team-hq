  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rockie</title>
    <meta name="description" content="Hábitos con prueba, agenda, apuntes y los proyectos de tu equipo en una sola app, con Rockie. Gratis para siempre; ni nosotros leemos lo tuyo." />
    <!-- vista previa al compartir el link (WhatsApp, redes): la imagen es la portada, public/og-rockie.jpg -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rockie" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="Rockie · Todas tus herramientas, en una sola mochila" />
    <meta property="og:description" content="Hábitos con prueba, agenda, apuntes y los proyectos de tu equipo en una sola app, con Rockie. Gratis para siempre." />
    <meta property="og:image" content="https://rockie.plus/og-rockie.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rockie asomando de una mochila: todas tus herramientas, en una sola mochila" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rockie" />
    <meta name="theme-color" content="#f0ebe5" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cpath d='M22 3C33 3 40 11 40 22C40 34 33 41 22 41C11 41 4 34 4 22C4 11 11 3 22 3Z' fill='%232a82ad'/%3E%3Cellipse cx='16' cy='20' rx='3.4' ry='4.6' fill='%23fdfbf7'/%3E%3Cellipse cx='28' cy='20' rx='3.4' ry='4.6' fill='%23fdfbf7'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // regreso de Google de Hábitos que cayó en la raíz: se lo pasa a Hábitos (que es quien lo espera)
      try {
        var rp = location.pathname;
        if ((rp === '/' || rp === '/inicio') && (/access_token=|error_description=/.test(location.hash) || /[?&]code=/.test(location.search))) {
          location.replace('/habitos/entrar' + location.search + location.hash);
        }
      } catch (e) {}
    </script>
    <script>
      try {
        var t = localStorage.getItem('hq.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('hq.accent');
        if (a) { document.documentElement.dataset.accent = '1'; document.documentElement.style.setProperty('--user-accent', a); }
      } catch (e) {}
    </script>
    <style>
      /* El primer cuadro ya es del color de la app (nunca blanco) y pasar entre Rockie OS y Hábitos (son dos páginas
         del sitio) es una transición del navegador: deja la pantalla de antes y funde a la nueva, sin parpadeo. */
      html { background: #f0ebe5; color-scheme: light; }
      html[data-theme='dark'] { background: #232136; color-scheme: dark; }
      @view-transition { navigation: auto; }
      ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.28s; animation-timing-function: cubic-bezier(0.32, 0.72, 0, 1); }
      @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <!-- antes que la app: así las animaciones ya nacen con la pausa de ventana escondida (src/os/arranque.ts) -->
    <script type="module" src="/src/os/arranque.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
